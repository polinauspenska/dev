  :root{
    --gold-1:#d7b56e;
    --gold-2:#c9a25c;
    --gold-3:#e8cd93;
    --bg:#0c0b0a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    background:var(--bg);
    overflow-x:hidden;
  }
  body{
    font-family:'Jost', 'Helvetica Neue', Arial, sans-serif;
  }

  /* ---------- Preloader ---------- */
  .preloader-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
    user-select:none;
    -webkit-user-select:none;
    transition:opacity 0.7s ease;
  }
  .preloader-overlay.fade-out{
    opacity:0;
    pointer-events:none;
  }
  .icon-stage{
    position:relative;
    width:141px;
    height:120px;
  }
  canvas#sandCanvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .wordmark{
    display:block;
    height:15px;
    width:170px;
    opacity:0;
    transform:translateY(4px);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .wordmark.show{
    opacity:1;
    transform:translateY(0);
  }

  /* ---------- Hero ---------- */
  .hero-scroll-wrap{
    position:relative;
    height:220vh;
  }
  .hero{
    position:sticky;
    top:0;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
  }
  .reveal-overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:14;
    pointer-events:none;
    display:block;
  }
  .hero-video{
    position:absolute;
    top:50%;
    left:50%;
    min-width:100%;
    min-height:100%;
    width:auto;
    height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }
  .hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,9,8,0.35) 0%, rgba(10,9,8,0.5) 55%, rgba(10,9,8,0.72) 100%);
  }
  .hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 24px;
    gap:10px;
  }
  @media (min-width:1024px){
    .hero-content{
      flex-direction:row;
      flex-wrap:nowrap;
      gap:18px;
      padding:0 40px;
    }
    .hero-line{
      white-space:nowrap;
    }
  }
  .hero-line{
    margin:0;
    font-family:'Jost-Light', sans-serif;
    font-weight:normal;
    text-transform:uppercase;
    color:#ffffff;
    font-size:28px;
    letter-spacing:normal;
    line-height:1.35;
    text-shadow:0 4px 24px rgba(0,0,0,0.45);
    opacity:0;
    transform:translateY(26px);
    transition:opacity 1.2s ease, transform 1.2s ease;
  }
  .hero-line.show{
    opacity:1;
    transform:translateY(0);
  }
  .hero-line:nth-child(1){ transition-delay:0s; }
  .hero-line:nth-child(2){ transition-delay:0.22s; }
  .hero-line:nth-child(3){ transition-delay:0.44s; }

  /* ---------- Scroll hint ---------- */
  .scroll-hint{
    position:absolute;
    left:50%;
    bottom:34px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:20;
    opacity:1;
    transition:opacity 0.5s ease;
  }
  .scroll-hint.hide{
    opacity:0;
    pointer-events:none;
  }
  .scroll-hint span{
    font-family:'Jost-Light', sans-serif;
    font-weight:normal;
    font-size:11px;
    letter-spacing:0.3em;
    color:#f0e6cf;
    text-transform:uppercase;
  }
  .scroll-hint .scroll-line{
    position:relative;
    width:1px;
    height:34px;
    overflow:hidden;
    background:rgba(240,230,207,0.25);
  }
  .scroll-hint .scroll-dot{
    position:absolute;
    top:0;
    left:-1.5px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--gold-1);
    animation:scrollDot 1.8s ease-in-out infinite;
  }
  @keyframes scrollDot{
    0%{ transform:translateY(0); opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(34px); opacity:0; }
  }

  /* ---------- Fixed header (revealed on scroll) ---------- */
  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 28px;
    background:rgba(12,11,10,0);
    transition:background 0.4s ease;
  }
  .site-header.visible{
    background:rgba(12,11,10,0.72);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .burger{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    width:26px;
    height:18px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    opacity:0;
    transform:translateX(-36px);
    transition:opacity 0.8s cubic-bezier(.22,.9,.34,1), transform 0.8s cubic-bezier(.22,.9,.34,1);
  }
  .burger span{
    display:block;
    width:100%;
    height:2px;
    background:#f5ecd8;
  }
  .site-header.visible .burger{
    opacity:1;
    transform:translateX(0);
  }
  .header-logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, 130px);
    opacity:0;
    transition:opacity 0.8s cubic-bezier(.22,.9,.34,1) 0.1s, transform 0.8s cubic-bezier(.22,.9,.34,1) 0.1s;
  }
  .header-logo img{
    display:block;
    height:30px;
    width:auto;
  }
  .site-header.visible .header-logo{
    transform:translate(-50%, -50%);
    opacity:1;
  }
  .contact-btn{
    font-family:'Jost', sans-serif;
    font-weight:400;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#f5ecd8;
    background:transparent;
    border:1px solid var(--gold-1);
    padding:9px 22px;
    border-radius:2px;
    text-decoration:none;
    white-space:nowrap;
    opacity:0;
    transform:translateX(36px);
    transition:opacity 0.8s cubic-bezier(.22,.9,.34,1) 0.05s, transform 0.8s cubic-bezier(.22,.9,.34,1) 0.05s, background 0.3s ease, color 0.3s ease;
  }
  .contact-btn:hover{
    background:var(--gold-1);
    color:#0c0b0a;
  }
  .site-header.visible .contact-btn{
    opacity:1;
    transform:translateX(0);
  }

  /* ---------- Placeholder next section (so there is room to scroll) ---------- */
  .next-section{
    position:relative;
    width:100%;
    height:100vh;
    background:var(--bg);
  }
</style>
</head>
<body>

  <div class="preloader-overlay" id="preloader">
    <div class="icon-stage">

  var W = DATA.w, H = DATA.h;
  var points = DATA.points;

  var canvas = document.getElementById('sandCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;

  function resize(){
    var stage = canvas.parentElement.getBoundingClientRect();
    canvas.width = stage.width * dpr;
    canvas.height = stage.height * dpr;
    ctx.setTransform(dpr * (stage.width/W), 0, 0, dpr * (stage.height/H), 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var COLORS = ['#d7b56e', '#c9a25c', '#e8cd93'];

  var FILL_DURATION = 4200;   // ms - sand filling the icon
  var HOLD_DURATION = 550;    // ms - hold complete icon before preloader fades

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  // ambient falling grains (decorative sand trickling from the top)
  var fallers = [];
  var FALLER_COUNT = 16;
  for (var i=0;i<FALLER_COUNT;i++){
    fallers.push({
      x: W*0.32 + Math.random()*W*0.36,
      y: -Math.random()*H,
      speed: 90 + Math.random()*70,
      size: 1.1 + Math.random()*1.6,
      c: COLORS[Math.floor(Math.random()*3)]
    });
  }

  var wordmark = document.getElementById('wordmark');
  var preloader = document.getElementById('preloader');
  var heroLines = document.querySelectorAll('.hero-line');

  // reveal the wordmark together with the very first frame of the icon animation
  wordmark.classList.add('show');

  var start = null;
  var lastT = null;
  var finished = false;

  function revealHero(){
    // 2 seconds after the preloader begins handing off to the hero
    setTimeout(function(){
      for (var i=0;i<heroLines.length;i++){
        heroLines[i].classList.add('show');
      }
    }, 2000);
  }

  function frame(ts){
    if (start === null) start = ts;
    if (lastT === null) lastT = ts;
    var dt = (ts - lastT)/1000;
    lastT = ts;

    var elapsed = ts - start;
    var capped = Math.min(elapsed, FILL_DURATION + HOLD_DURATION);

    var progress, fillActive;
    if (capped < FILL_DURATION){
      progress = easeOutCubic(capped / FILL_DURATION);
      fillActive = true;
    } else {
      progress = 1;
      fillActive = false;
    }

    ctx.clearRect(0,0,W,H);
    ctx.save();

    // faint ghost silhouette of the full mark (guide beneath the grains)
    ctx.save();
    ctx.globalAlpha = 0.14;
    for (var g=0; g<points.length; g++){
      var p = points[g];
      var sz = 2.6 * p.s;
      ctx.fillStyle = '#c9a25c';
      ctx.fillRect(p.x - sz/2, p.y - sz/2, sz, sz);
    }
    ctx.restore();

    var frontierY = H * (1 - progress);

    var settleWindow = 0.055;
    for (var i=0;i<points.length;i++){
      var p = points[i];
      if (p.r <= progress){
        var age = progress - p.r;
        var sz = 3.1 * p.s;
        var oy = 0, scale = 1;
        if (age < settleWindow){
          var t2 = age/settleWindow;
          var eased = 1 - Math.pow(1-t2, 2);
          oy = -(1-eased) * 7;
          scale = 0.5 + eased*0.5;
        }
        ctx.globalAlpha = p.a;
        ctx.fillStyle = COLORS[p.c];
        var s2 = sz*scale;
        ctx.fillRect(p.x - s2/2, p.y + oy - s2/2, s2, s2);
      }
    }
    ctx.globalAlpha = 1;

    if (fillActive){
      for (var f=0; f<fallers.length; f++){
        var fp = fallers[f];
        fp.y += fp.speed * dt;
        if (fp.y > frontierY + Math.random()*6){
          fp.y = -Math.random()*30;
          fp.x = W*0.32 + Math.random()*W*0.36;
          fp.speed = 90 + Math.random()*70;
        }
        ctx.fillStyle = fp.c;
        ctx.fillRect(fp.x, fp.y, fp.size, fp.size*2.2);
      }
    }

    ctx.restore();

    if (elapsed >= FILL_DURATION + HOLD_DURATION){
      if (!finished){
        finished = true;
        preloader.classList.add('fade-out');
        revealHero();
      }
      return; // stop the animation loop
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // ---------- Scroll-linked sequence: text fade -> triangle rise -> expand -> header ----------
  var siteHeader = document.getElementById('siteHeader');
  var scrollHint = document.getElementById('scrollHint');
  var heroScrollWrap = document.getElementById('heroScrollWrap');
  var heroEl = document.querySelector('.hero');
  var revealOverlay = document.getElementById('revealOverlay');
  var revealHole = document.getElementById('revealHole');
  var heroLinesArr = document.querySelectorAll('.hero-line');

  function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  var TEXT_FADE_END   = 0.12;
  var RISE_START      = 0.05;
  var RISE_END        = 0.45;
  var EXPAND_START    = 0.45;
  var EXPAND_END      = 0.95;
  var HEADER_THRESHOLD = 0.9;

  // Local coordinate space of the icon group drawn above (real AFM logo, 4 vector strokes, lossless at any scale)
  var HULL_W = 300.168, HULL_H = 260.465;
  var HULL_CX = HULL_W/2, HULL_CY = HULL_H/2;
  var MASK_MIN_W = 320; // px, hole width once fully appeared (bottom, before rise) -- 200% of original 160px
  var APPEAR_END = 0.05; // progress at which the shape has fully grown in from nothing

  var scrollTicking = false;

  function updateScrollEffects(){
    scrollTicking = false;
    var scrollY = window.scrollY || window.pageYOffset;
    var vh = window.innerHeight;
    var vw = heroEl.clientWidth || window.innerWidth;

    // scroll hint disappears the moment scrolling starts
    if (scrollY > 10){
      scrollHint.classList.add('hide');
    } else {
      scrollHint.classList.remove('hide');
    }

    var wrapHeight = heroScrollWrap.offsetHeight;
    var scrollable = Math.max(wrapHeight - vh, 1);
    var progress = clamp01(scrollY / scrollable);

    // Phase 0: hero text fades out first
    var textOpacity = 1 - clamp01(progress / TEXT_FADE_END);
    for (var i=0; i<heroLinesArr.length; i++){
      heroLinesArr[i].style.opacity = textOpacity;
    }

    // enough to fully cover the viewport once centered, regardless of aspect ratio
    var MASK_MAX_W = Math.max(vw, vh / (HULL_H/HULL_W)) * 1.35;

    var holeW, cxPct, cyPct;
    // Phase 0: nothing is visible until the user actually scrolls -- the shape
    // grows in from zero right at the bottom, so at progress===0 it's fully hidden.
    // Phase 1 + 2: the hero itself never moves (position:sticky) -- only the
    // shape (drawn directly in the SVG) rises then expands.
    if (progress <= APPEAR_END){
      var t0 = clamp01(progress / APPEAR_END);
      holeW = MASK_MIN_W * easeInOutQuad(t0);
      cyPct = 88;
      cxPct = 50;
    } else if (progress <= RISE_END){
      var t1 = clamp01((progress - RISE_START) / (RISE_END - RISE_START));
      var eased1 = easeInOutQuad(t1);
      cyPct = lerp(88, 50, eased1); // percent, bottom -> center
      cxPct = 50;
      holeW = MASK_MIN_W;
    } else {
      var t2 = clamp01((progress - EXPAND_START) / (EXPAND_END - EXPAND_START));
      var eased2 = easeInOutQuad(t2);
      holeW = lerp(MASK_MIN_W, MASK_MAX_W, eased2);
      cxPct = 50;
      cyPct = 50;
    }

    var scale = holeW / HULL_W;
    var cx = vw * (cxPct/100);
    var cy = vh * (cyPct/100);
    var tx = cx - HULL_CX*scale;
    var ty = cy - HULL_CY*scale;
    revealHole.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')');

    // Phase 3: header only appears once the reveal has essentially covered the section
    if (progress >= HEADER_THRESHOLD){
      siteHeader.classList.add('visible');
    } else {
      siteHeader.classList.remove('visible');
    }
  }

  function onScroll(){
    if (!scrollTicking){
      scrollTicking = true;
      requestAnimationFrame(updateScrollEffects);
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  updateScrollEffects();
})();
